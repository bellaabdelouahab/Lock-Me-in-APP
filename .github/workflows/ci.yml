name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Logic tests
        run: ./gradlew :core:test --console=plain

  # Boots a real Android emulator, makes the app its device owner and checks that Android itself enforces the policy.
  device-owner-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device-owner tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/ci-emulator.sh
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/

  debug-apk:
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Every APK is signed with the one release key from the repo's secrets, so the in-app updater can install it over the last one.
      - name: Release key
        env:
          KEY_B64: ${{ secrets.LMI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/lockmein.jks"; echo "LMI_KEYSTORE=$RUNNER_TEMP/lockmein.jks" >> "$GITHUB_ENV"; fi
      # The test build: a test-only APK (removable over USB) for the real device-owner setup. Install with `adb install -t`.
      - run: ./gradlew :app:assembleRelease -PtestOnly=true --console=plain
        env:
          LMI_KEYSTORE_PASSWORD: ${{ secrets.LMI_KEYSTORE_PASSWORD }}
      - run: mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk dist/lock-me-in-test-build.apk
      # The preview build: installs from the phone's own installer, to look at the screens. It cannot start protection.
      - run: ./gradlew :app:assembleRelease -Ppreview=true --console=plain
        env:
          LMI_KEYSTORE_PASSWORD: ${{ secrets.LMI_KEYSTORE_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk dist/lock-me-in-preview.apk
      # The sealed build: blocks USB debugging and factory reset. Only after the test nights.
      - run: ./gradlew :app:assembleRelease --console=plain
        env:
          LMI_KEYSTORE_PASSWORD: ${{ secrets.LMI_KEYSTORE_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk dist/lock-me-in-sealed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lock-me-in-apks
          path: dist/

  # Publishes the APKs as the latest GitHub release, which the app's updater reads. Only from main, and only when the
  # emulator tests passed: a build that fails them never reaches a phone.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [debug-apk, device-owner-emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lock-me-in-apks
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$((100 + GITHUB_RUN_NUMBER)); name="0.4.$GITHUB_RUN_NUMBER"
          notes=$(git log -1 --pretty=%s)
          jq -n --argjson code "$code" --arg name "$name" --arg notes "$notes" '{versionCode: $code, versionName: $name, notes: $notes}' > dist/version.json
          gh release create "v$name" dist/* --title "Lock Me In $name" --notes "$notes" --latest
