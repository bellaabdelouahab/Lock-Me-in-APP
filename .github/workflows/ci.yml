name: ci

# A push that only touches notes (docs, markdown, agent briefs) builds and ships nothing: the app is the same.
# Anything else runs every job below; a run started by hand always runs everything.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agent-runs/**'
      - 'emulator-report/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agent-runs/**'
      - 'emulator-report/**'
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache NSFW evaluation dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/nsfw_model_eval
          key: nsfw-model-eval-v1
      - name: Logic tests
        run: ./gradlew :core:test --console=plain

  # Boots a real Android emulator, makes the app its device owner and checks that Android itself enforces the policy.
  device-owner-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device-owner tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/ci-emulator.sh
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/

  # The three APKs build side by side (they used to build one after another). Each needs only the source, not the tests:
  # the release job below still waits for every test job before anything is published.
  debug-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # The test build: removable over USB, for the real device-owner setup (the build on the owner's phone).
          - kind: test-build
            flags: -PtestOnly=true
          # The preview build: its own app id (app.lockmein.preview), to look at the screens. It cannot start protection.
          - kind: preview
            flags: -Ppreview=true
          # The sealed build: blocks USB debugging and factory reset.
          - kind: sealed
            flags: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Every APK is signed with the one release key from the repo's secrets, so the in-app updater can install it over the last one.
      - name: Release key
        env:
          KEY_B64: ${{ secrets.LMI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/lockmein.jks"; echo "LMI_KEYSTORE=$RUNNER_TEMP/lockmein.jks" >> "$GITHUB_ENV"; fi
      - run: ./gradlew :app:assembleRelease ${{ matrix.flags }} --console=plain
        env:
          LMI_KEYSTORE_PASSWORD: ${{ secrets.LMI_KEYSTORE_PASSWORD }}
      - run: mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk dist/lock-me-in-${{ matrix.kind }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.kind }}
          path: dist/

  # Every screen drawn on the runner (Robolectric, no emulator), for a quick look at a branch: about 3 minutes.
  # Only for looking at; it checks nothing, and nothing waits for it.
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest --tests 'app.lockmein.ScreenShots' -Ppreview=true -Dshots.dir="$PWD/shots" --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: shots/

  # Publishes the APKs as the latest GitHub release, which the app's updater reads. Only from main, and only when the
  # emulator tests passed: a build that fails them never reaches a phone.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [core-tests, debug-apk, device-owner-emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$((100 + GITHUB_RUN_NUMBER)); name="0.4.$GITHUB_RUN_NUMBER"
          notes=$(git log -1 --pretty=%s)
          jq -n --argjson code "$code" --arg name "$name" --arg notes "$notes" '{versionCode: $code, versionName: $name, notes: $notes}' > dist/version.json
          gh release create "v$name" dist/* --title "Lock Me In $name" --notes "$notes" --latest
