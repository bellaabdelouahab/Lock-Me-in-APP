name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Logic tests
        run: ./gradlew :core:test --console=plain

  # Boots a real Android emulator, makes the app its device owner and checks that Android itself enforces the policy.
  device-owner-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device-owner tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell "ping -c 1 -W 3 8.8.8.8; echo ping_rc=\$?"
            adb shell "echo | toybox nc -w 5 8.8.8.8 853; echo dot_8888_rc=\$?"
            adb shell "echo | toybox nc -w 5 1.1.1.1 853; echo dot_1111_rc=\$?"
            adb shell "nslookup dns.google 2>&1 | head -4"
            ./gradlew :app:installDebug --console=plain
            adb shell dpm set-device-owner app.lockmein/.AdminReceiver
            ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/

  debug-apk:
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: lock-me-in-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
