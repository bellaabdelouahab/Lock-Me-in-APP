# Blocky for Lock Me In (FEATURES 3.17). No admin page, and its API port (4000) is reachable only from the relay on the
# service's own network, never published or routed: these rules change only by a commit and a redeploy. The phone reaches it
# as dns.abdelouahab.xyz over DNS-over-TLS; Coolify's proxy holds the certificate and passes the plain DNS stream to port 53.
upstreams:
  groups:
    default:
      # Two family resolvers: adult sites are filtered a second time behind the lists below.
      - https://family.cloudflare-dns.com/dns-query
      - https://doh.cleanbrowsing.org/doh/adult-filter/
  strategy: parallel_best
  timeout: 3s

bootstrapDns:
  - upstream: https://1.1.1.1/dns-query
  - upstream: 9.9.9.9

blocking:
  denylists:
    # Every entry is a wildcard (*.name): Blocky matches a plain name exactly, so www.name would get through.
    lists:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.txt
    adult:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/nsfw.txt
    bypass:
      # Other DNS-over-HTTPS resolvers, VPNs and proxies: ways around this server.
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/doh-vpn-proxy-bypass.txt
    gambling:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/gambling.txt
    dating:
      - |
        *.tinder.com
        *.gotinder.com
        *.bumble.com
        *.bumble.app
        *.badoo.com
        *.hinge.co
        *.okcupid.com
        *.match.com
        *.pof.com
        *.plentyoffish.com
        *.grindr.com
        *.grindr.mobi
        *.happn.com
        *.happn.app
        *.hily.com
        *.meetic.com
        *.meetic.fr
        *.lovoo.com
        *.zoosk.com
        *.coffeemeetsbagel.com
        *.feeld.co
        *.tantanapp.com
        *.muzz.com
        *.muzmatch.com
        *.boo.world
        *.jaumo.com
        *.skout.com
        *.tagged.com
        *.mamba.ru
        *.eharmony.com
        *.elitesingles.com
        *.lovoo.net
        *.taimi.com
    # TikTok, Instagram, Facebook and YouTube, closed outside the recreation time (20:00 to 21:30 every day, as in NextDNS).
    # The relay opens this group for the recreation time only, through Blocky's API, and Blocky closes it again by itself
    # when the time is up: if the relay is down, it stays closed.
    social:
      - |
        *.tiktok.com
        *.tiktokv.com
        *.tiktokv.us
        *.tiktokcdn.com
        *.tiktokcdn-us.com
        *.tiktokcdn-eu.com
        *.tiktokw.us
        *.ttwstatic.com
        *.musical.ly
        *.byteoversea.com
        *.ibytedtos.com
        *.ibyteimg.com
        *.muscdn.com
        *.instagram.com
        *.cdninstagram.com
        *.instagr.am
        *.ig.me
        *.facebook.com
        *.facebook.net
        *.fb.com
        *.fb.me
        *.fb.gg
        *.fbcdn.net
        *.fbsbx.com
        *.fb.watch
        *.youtube.com
        *.youtu.be
        *.youtube-nocookie.com
        *.youtubekids.com
        *.ytimg.com
        *.googlevideo.com
        *.youtubei.googleapis.com
        *.youtube.googleapis.com
        *.yt.be
  clientGroupsBlock:
    default: [lists, adult, bypass, gambling, dating, social]
  blockType: zeroIp
  blockTTL: 1m
  loading:
    refreshPeriod: 12h
    strategy: fast
    downloads:
      timeout: 60s
      attempts: 5

customDNS:
  # Safe search and YouTube's strict restricted mode, whatever the browser or app asks for.
  zone: |
    www.google.com. 300 CNAME forcesafesearch.google.com.
    www.google.co.ma. 300 CNAME forcesafesearch.google.com.
    www.google.fr. 300 CNAME forcesafesearch.google.com.
    www.bing.com. 300 CNAME strict.bing.com.
    duckduckgo.com. 300 CNAME safe.duckduckgo.com.
    www.duckduckgo.com. 300 CNAME safe.duckduckgo.com.
    www.youtube.com. 300 CNAME restrict.youtube.com.
    m.youtube.com. 300 CNAME restrict.youtube.com.
    youtubei.googleapis.com. 300 CNAME restrict.youtube.com.
    youtube.googleapis.com. 300 CNAME restrict.youtube.com.
    www.youtube-nocookie.com. 300 CNAME restrict.youtube.com.
  filterUnmappedTypes: false

caching:
  minTime: 5m
  prefetching: true

queryLog:
  type: sqlite
  target: /logs/querylog.db
  logRetentionDays: 7
  flushInterval: 30s
  fields: [question, responseReason, duration]

ports:
  dns: 53
  http: 4000

log:
  level: warn
