# Lock Me In relay for Coolify (same pattern as the Vikunja MCP). Set MCP_SECRET (32+ chars) and PAIR_CODE (8+ chars) in Coolify,
# and the domain (e.g. https://lockmein.abdelouahab.xyz) on the relay service. WebSockets pass through Coolify's proxy as is.
services:
  relay:
    image: python:3.12-slim
    environment:
      - SERVICE_URL_RELAY_8000
      - MCP_SECRET=${MCP_SECRET}
      - PAIR_CODE=${PAIR_CODE}
      - DATA_DIR=/data
    command: ["sh", "-c", "pip install -q --root-user-action=ignore mcp==1.30.0 uvicorn==0.38.0 websockets==15.0.1 && python /app/relay.py"]
    volumes:
      - /home/ubuntu/lock-me-in/server/relay.py:/app/relay.py:ro
      - relay-data:/data
      - dns-logs:/dns-logs:ro
  # The DNS server (FEATURES 3.17). No port published to the internet: Coolify's proxy takes DNS-over-TLS on 853 for
  # dns.abdelouahab.xyz (an entry point named dot, added once in the proxy settings, docs/DNS.md) and passes the plain
  # stream to port 53 here.
  dns:
    image: ghcr.io/0xerr0r/blocky:v0.37.0
    volumes:
      - /home/ubuntu/lock-me-in/server/dns/config.yml:/app/config.yml:ro
      - dns-logs:/logs
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.lockmein-dot.entrypoints=dot
      - traefik.tcp.routers.lockmein-dot.rule=HostSNI(`${DNS_DOMAIN:-dns.abdelouahab.xyz}`)
      - traefik.tcp.routers.lockmein-dot.tls=true
      - traefik.tcp.routers.lockmein-dot.tls.certresolver=letsencrypt
      - traefik.tcp.routers.lockmein-dot.service=lockmein-dot
      - traefik.tcp.services.lockmein-dot.loadbalancer.server.port=53
      # The same name over HTTP, only so Let's Encrypt can check it (port 80): every page answers 404.
      - traefik.http.routers.lockmein-dns-cert.rule=Host(`${DNS_DOMAIN:-dns.abdelouahab.xyz}`)
      - traefik.http.routers.lockmein-dns-cert.entrypoints=https
      - traefik.http.routers.lockmein-dns-cert.tls.certresolver=letsencrypt
      - traefik.http.routers.lockmein-dns-cert.service=noop@internal
    restart: unless-stopped
volumes:
  relay-data:
  dns-logs:
